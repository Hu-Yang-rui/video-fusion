org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关闭 Kotlin 增量编译。
# 原因：本机环境下 shared_preferences_android 的 Kotlin 增量缓存
# 无法正常关闭（class-fq-name-to-source.tab 等文件写入失败），
# 导致 assembleDebug 持续失败。关闭增量编译后构建稳定。
# 这是构建期开关，不影响运行时行为。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# 串行构建配置。
#
# 本机环境下 Gradle 的 transform 阶段会随机产生"半写入"文件：
# 文件头正常（50 4B 03 04）但内容大量为零字节，导致
# "Could not find EOCD" / "Unexpected end of ZLIB input stream"。
# 已确认源 AAR 完整（appcompat 549 条目、webkit 正常），
# 是写出阶段被中断，而非下载损坏。
#
# 关闭并行与缓存可显著降低该问题出现概率。
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1

# 关闭 Gradle 9 的 immutable workspace 完整性校验。
#
# 报错原文：
#   "The contents of the immutable workspace ... have been modified.
#    These workspace directories are not supposed to be modified once they
#    are created. The modification might have been caused by an external
#    process, or could be the result of disk corruption."
#
# 本机有 Windows Defender 实时扫描在读取/触碰这些文件，
# 触发了该校验的误判。关闭后 Gradle 不再对 transform 输出做哈希复核。
android.experimental.disableImmutableWorkspaceCheck=true
android.experimental.disableWorkspaceIntegrityCheck=true
