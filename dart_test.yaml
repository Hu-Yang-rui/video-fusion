# dart test 配置
#
# 只做一件事：把默认的单测超时从 30s 放宽到 120s。
#
# # 为什么必须放宽（实测依据，2026-10-19）
#
# 本项目有一批**真实网络**用例（`tags: 'network'`）：B站/抖音的公开
# 接口。其中抖音直播 feed 实测**空 body 率约 71%**（HTTP 200 但
# len=0），客户端为此带 5 次重试；单独跑这些文件是稳的（实测
# `flutter test test/douyin_live_test.dart` → +11 全绿），
# 但在全量套件里叠加其它网络用例的排队与重试，会撞上默认 30s
# 上限，报成 "did not complete"。
#
# 这**不是**断言失败，也不是逻辑错误 —— 放宽超时不会让任何断言
# 变松，只是承认"真实网络 + 重试"需要更长时间。实测同一条命令
# 加 `--timeout 120s` 后：`+535 ~8: All tests passed!`
#
# 注意：`~8` 是"无凭据时自动跳过"的真实网络用例
# （`test/favorite_live_test.dart` 需要仓库外的 cookie 文件，
# 其中两个写入用例还要 VF_ALLOW_WRITE=1）。跳过是显式的，
# 不会伪装成通过。
timeout: 120s
